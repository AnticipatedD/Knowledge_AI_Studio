name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate via Hugging Face Trusted Publisher (OIDC)
        id: hf-auth
        uses: huggingface/oidc-login@v1
        with:
          audience: https://huggingface.co

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ steps.hf-auth.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push --force https://AnticipatedD:${HF_TOKEN}@huggingface.co/spaces/AnticipatedD/Knowledge_AI_Studio main
